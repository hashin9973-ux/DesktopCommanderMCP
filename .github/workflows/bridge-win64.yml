name: Windows x64 bridge executable

on:
  push:
    branches: [main]
    paths:
      - 'src/bridge/**'
      - 'src/local-api/**'
      - 'src/index.ts'
      - 'scripts/bridge-launcher.cjs'
      - 'scripts/bridge-launcher-modes.cjs'
      - 'test/test-bridge-launcher-modes.js'
      - 'test/test-bridge-*.js'
      - 'test/test-local-api.js'
      - 'docs/GITHUB_REPOSITORY_BRIDGE.md'
      - 'docs/LOCAL_OPENAI_COMPATIBLE_API.md'
      - '.github/PORTABLE_RELEASE'
      - '.github/workflows/bridge-win64.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-smoke-test:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.23.4
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          # @vscode/ripgrep downloads its platform binary via the GitHub API.
          # Authenticate this download to avoid anonymous shared-runner rate limits.
          GITHUB_TOKEN: ${{ github.token }}

      - name: Build and run bridge and security regression tests
        run: >-
          npm test --
          test-bridge-launcher-modes.js
          test-bridge-protocol.js
          test-bridge-agents.js
          test-bridge-guide.js
          test-bridge-github.js
          test-bridge-github-webhook.js
          test-bridge-github-auth.js
          test-conditional-tools.js
          test-local-api.js
          test-atomic-write.js
          test-file-handlers.js
          test-read-multiple-files.js
          test-allowed-directories.js
          test-blocked-commands.js
          test-startup-imports.js
          test-image-write-file-append.js
          test-mailbox.js

      - name: Build standalone Windows x64 executable
        run: npm run build:bridge:win64

      - name: Bundle verified GitHub CLI for browser authentication
        shell: pwsh
        run: |
          $version = "2.103.3"
          $archiveName = "gh_$($version)_windows_amd64.zip"
          $archivePath = Join-Path $env:RUNNER_TEMP $archiveName
          $extractPath = Join-Path $env:RUNNER_TEMP "desktop-commander-gh"
          $downloadUrl = "https://github.com/cli/cli/releases/download/v$version/$archiveName"
          Invoke-WebRequest -Uri $downloadUrl -OutFile $archivePath

          $expectedSha256 = "98d0cfa794721665d7973dd728c78aff7bd836d58f10f6d7a03568eccb0a22e0"
          $actualSha256 = (Get-FileHash -Path $archivePath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualSha256 -ne $expectedSha256) {
            throw "GitHub CLI archive SHA-256 mismatch. Expected $expectedSha256; got $actualSha256."
          }

          Expand-Archive -Path $archivePath -DestinationPath $extractPath -Force
          $ghExeFile = Get-ChildItem -Path $extractPath -Filter gh.exe -File -Recurse | Select-Object -First 1
          if ($null -eq $ghExeFile) {
            throw "The verified GitHub CLI archive did not contain gh.exe."
          }

          # Install the verified executable at one fixed path independent of
          # how the upstream ZIP nests its distribution files.
          $targetDir = Join-Path $PWD "build\PortableBridge\tools"
          New-Item -ItemType Directory -Force -Path $targetDir | Out-Null
          Copy-Item -Path $ghExeFile.FullName -Destination (Join-Path $targetDir "gh.exe") -Force
          $licenseFiles = Get-ChildItem -Path $extractPath -Filter "LICENSE*" -File -Recurse
          foreach ($licenseFile in $licenseFiles) {
            Copy-Item -Path $licenseFile.FullName -Destination (Join-Path $targetDir $licenseFile.Name) -Force
          }
          & (Join-Path $targetDir "gh.exe") --version
          if ($LASTEXITCODE -ne 0) {
            throw "The bundled GitHub CLI failed its version check."
          }


      - name: Bundle verified Cloudflare Quick Tunnel client
        shell: pwsh
        run: |
          $version = "2026.10.7"
          $targetDir = Join-Path $PWD "build\PortableBridge\tools"
          New-Item -ItemType Directory -Force -Path $targetDir | Out-Null
          $cloudflaredPath = Join-Path $targetDir "cloudflared.exe"
          $downloadUrl = "https://github.com/cloudflare/cloudflared/releases/download/$version/cloudflared-windows-amd64.exe"
          Invoke-WebRequest -Uri $downloadUrl -OutFile $cloudflaredPath

          $expectedSha256 = "2493dbc168923bb3e59e5e7716f71deced92992eea9acd6e9d74f84ac7751343"
          $actualSha256 = (Get-FileHash -Path $cloudflaredPath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualSha256 -ne $expectedSha256) {
            throw "cloudflared SHA-256 mismatch. Expected $expectedSha256; got $actualSha256."
          }

          $licensePath = Join-Path $targetDir "cloudflared-LICENSE"
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/cloudflare/cloudflared/$version/LICENSE" -OutFile $licensePath
          $versionOutput = (& $cloudflaredPath --version 2>&1 | Out-String)
          if ($LASTEXITCODE -ne 0 -or $versionOutput -notmatch [regex]::Escape($version)) {
            throw "The bundled cloudflared executable failed its version check. Expected $version; got $versionOutput."
          }

      - name: Verify executable CLI
        shell: pwsh
        run: |
          & build\PortableBridge\DesktopCommanderBridge.exe bridge --help
          if ($LASTEXITCODE -ne 0) { throw "Bridge executable help command failed." }
          & build\PortableBridge\DesktopCommanderBridge.exe remote --help
          if ($LASTEXITCODE -ne 0) { throw "Remote MCP executable help command failed." }
          & build\PortableBridge\DesktopCommanderBridge.exe local-api --help
          if ($LASTEXITCODE -ne 0) { throw "Local API executable help command failed." }

      - name: Smoke-test file bridge and image artifact export
        shell: pwsh
        run: |
          $cloudDir = Join-Path $env:TEMP "DesktopCommanderBridgeSmoke"
          $agentRoot = Join-Path $cloudDir "agent-smoke-1a2b3c4d5e6f"
          $otherAgentRoot = Join-Path $cloudDir "agent-smoke-7a8b9c0d1e2f"
          $stateDir = Join-Path $env:LOCALAPPDATA "DesktopCommanderBridge"
          New-Item -ItemType Directory -Force -Path $agentRoot, (Join-Path $agentRoot 'requests'), (Join-Path $agentRoot 'responses'), $otherAgentRoot, (Join-Path $otherAgentRoot 'requests'), (Join-Path $otherAgentRoot 'responses'), $stateDir | Out-Null

          $settings = @{
            directory = $cloudDir
            pollIntervalMs = 1000
            commandDelayMs = 0
            maxParallelRequests = 0
            maxStorageBytes = 3000000000
            consentAccepted = $true
          } | ConvertTo-Json
          [System.IO.File]::WriteAllText(
            (Join-Path $stateDir "settings.json"),
            $settings,
            [System.Text.UTF8Encoding]::new($false)
          )

          $imagePath = Join-Path $cloudDir "pixel.png"
          $png = "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAwMCAO+/pWQAAAAASUVORK5CYII="
          [System.IO.File]::WriteAllBytes($imagePath, [Convert]::FromBase64String($png))

          $imageRequest = @{
            protocol_version = 1
            id = "smoke-image"
            command_delay_ms = 5000
            commands = @(
              @{ tool = "read_file"; arguments = @{ path = $imagePath } },
              @{ tool = "get_file_info"; arguments = @{ path = $imagePath } }
            )
          } | ConvertTo-Json -Depth 20
          $configRequest = @{
            protocol_version = 1
            id = "smoke-config"
            commands = @(
              @{ tool = "get_config"; arguments = @{} }
            )
          } | ConvertTo-Json -Depth 20

          # A second ChatGPT conversation intentionally reuses this request ID.
          # Its queue and processing ledger must remain isolated in its own folder.
          $sameIdOtherAgentRequest = @{
            protocol_version = 1
            id = "smoke-config"
            commands = @(
              @{ tool = "get_config"; arguments = @{} }
            )
          } | ConvertTo-Json -Depth 20

          $imageRequestPath = Join-Path $agentRoot "requests\smoke-image.json"
          [System.IO.File]::WriteAllText(
            $imageRequestPath,
            '{ "protocol_version": 1,',
            [System.Text.UTF8Encoding]::new($false)
          )
          [System.IO.File]::WriteAllText(
            (Join-Path $agentRoot "requests\smoke-config.json"),
            $configRequest,
            [System.Text.UTF8Encoding]::new($false)
          )
          [System.IO.File]::WriteAllText(
            (Join-Path $otherAgentRoot "requests\smoke-config.json"),
            $sameIdOtherAgentRequest,
            [System.Text.UTF8Encoding]::new($false)
          )

          $exe = (Resolve-Path "build\PortableBridge\DesktopCommanderBridge.exe").Path
          $processArgs = 'bridge --directory "' + $cloudDir + '" --max-parallel 0'
          $stdout = Join-Path $env:TEMP "dc-bridge-smoke-out.txt"
          $stderr = Join-Path $env:TEMP "dc-bridge-smoke-err.txt"
          $process = Start-Process -FilePath $exe -ArgumentList $processArgs -PassThru -NoNewWindow -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          # Simulate a cloud-sync client exposing a partially written file before
          # the completed request arrives. Wait until the worker has actually
          # observed and deferred the incomplete JSON before completing the file.
          $partialDeadline = (Get-Date).AddSeconds(15)
          $partialObserved = $false
          while ((Get-Date) -lt $partialDeadline) {
            $partialLog = Get-Content $stderr -Raw -ErrorAction SilentlyContinue
            if ($partialLog -match "is not valid yet") {
              $partialObserved = $true
              break
            }
            if ($process.HasExited) {
              throw "Bridge exited before observing the partial request. stdout: $(Get-Content $stdout -Raw -ErrorAction SilentlyContinue) stderr: $partialLog"
            }
            Start-Sleep -Milliseconds 100
          }
          if (!$partialObserved) { throw "Bridge did not observe the intentionally partial request." }
          [System.IO.File]::WriteAllText($imageRequestPath, $imageRequest, [System.Text.UTF8Encoding]::new($false))

          try {
            $imageResponsePath = Join-Path $agentRoot "responses\smoke-image.json"
            $configResponsePath = Join-Path $agentRoot "responses\smoke-config.json"
            $otherAgentResponsePath = Join-Path $otherAgentRoot "responses\smoke-config.json"

            # The first request pauses for five seconds between its two commands.
            # The independent request must complete during that pause.
            $parallelDeadline = (Get-Date).AddSeconds(3)
            while ((Get-Date) -lt $parallelDeadline -and (!(Test-Path $configResponsePath) -or !(Test-Path $otherAgentResponsePath))) {
              if ($process.HasExited) {
                throw "Bridge exited before the independent request completed. stdout: $(Get-Content $stdout -Raw -ErrorAction SilentlyContinue) stderr: $(Get-Content $stderr -Raw -ErrorAction SilentlyContinue)"
              }
              Start-Sleep -Milliseconds 100
            }
            if (!(Test-Path $configResponsePath) -or !(Test-Path $otherAgentResponsePath)) {
              throw "Independent requests from separate agent folders did not both complete during the first request's 5-second command delay."
            }
            if (Test-Path $imageResponsePath) {
              throw "The two commands in one request did not respect the configured sequential command delay."
            }

            $deadline = (Get-Date).AddSeconds(60)
            while ((Get-Date) -lt $deadline -and !(Test-Path $imageResponsePath)) {
              if ($process.HasExited) {
                throw "Bridge exited before producing the image response. stdout: $(Get-Content $stdout -Raw -ErrorAction SilentlyContinue) stderr: $(Get-Content $stderr -Raw -ErrorAction SilentlyContinue)"
              }
              Start-Sleep -Milliseconds 200
            }
            if (!(Test-Path $imageResponsePath)) {
              throw "Bridge did not finish the sequential image request within 60 seconds."
            }

            $imageResponse = Get-Content $imageResponsePath -Raw | ConvertFrom-Json
            $configResponse = Get-Content $configResponsePath -Raw | ConvertFrom-Json
            $otherAgentResponse = Get-Content $otherAgentResponsePath -Raw | ConvertFrom-Json
            if ($imageResponse.status -ne "completed" -or $imageResponse.results.Count -ne 2) {
              throw "Sequential multi-command image request failed: $($imageResponse | ConvertTo-Json -Depth 10)"
            }
            if ($configResponse.status -ne "completed" -or $configResponse.results.Count -ne 1) {
              throw "Independent config request failed: $($configResponse | ConvertTo-Json -Depth 10)"
            }
            if ($otherAgentResponse.status -ne "completed" -or $otherAgentResponse.id -ne $configResponse.id -or $otherAgentResponse.results.Count -ne 1) {
              throw "The second ChatGPT conversation did not receive an independent response for its reused request ID: $($otherAgentResponse | ConvertTo-Json -Depth 10)"
            }
            if ($imageResponse.artifacts.Count -lt 1) {
              throw "Image read did not produce an artifact reference."
            }

            $relativeArtifact = $imageResponse.artifacts[0].path.Replace('/', '\')
            $artifactPath = Join-Path $agentRoot $relativeArtifact
            if (!(Test-Path $artifactPath)) {
              throw "The image artifact referenced by the response was not materialized: $artifactPath"
            }
            $guidePath = Join-Path $cloudDir "README.md"
            if (!(Test-Path $guidePath)) {
              throw "Bridge did not generate README.md in the configured cloud folder."
            }
            $guideContent = Get-Content $guidePath -Raw
            if (!$guideContent.Contains("agent-<uniqueid>/{requests,responses,artifacts}/") -or !$guideContent.Contains("agent-<parent>/subagents/agent-<child>")) {
              throw "Generated bridge README is missing the root and nested subagent workspace layouts."
            }
            if (!$guideContent.Contains("Each full hierarchical workspace path identifies one agent instance")) {
              throw "Generated bridge README does not describe hierarchical folder-based agent identity."
            }
            if ($guideContent.Contains("mailbox_user_id") -or $guideContent.Contains("## Optional local mailbox")) {
              throw "Generated bridge README still couples bridge agents to mailbox identities."
            }
            if (!$guideContent.Contains("Never share a workspace between conversations") -or !$guideContent.Contains("Keep your assigned workspace path")) {
              throw "Generated bridge README does not require a separate persistent workspace for each conversation."
            }
            if (!$guideContent.Contains("agent-4l/requests/task-a1.json") -or !$guideContent.Contains("agent-4l/subagents/agent-7b/requests/task-a1.json") -or !$guideContent.Contains("<your-workspace>/responses/<id>.json")) {
              throw "Generated bridge README is missing root and nested subagent request/response path examples."
            }
            if (Test-Path (Join-Path $cloudDir "requests")) {
              throw "The bridge created a legacy flat requests folder instead of a root-level agent-<uniqueid> folder."
            }
            if (Test-Path (Join-Path $cloudDir "agents")) {
              throw "The bridge created the obsolete agents/ parent folder."
            }
            if (Test-Path (Join-Path $cloudDir "agent-default")) {
              throw "A fresh bridge root must not create a synthetic shared agent-default folder."
            }
            if ($guideContent.Contains("status/status-") -or $guideContent.Contains("status/worker.json")) {
              throw "Generated bridge README refers to status files that this bridge does not publish."
            }
          }
          finally {
            if (!$process.HasExited) {
              Stop-Process -Id $process.Id -Force
              $process.WaitForExit()
            }
          }

      - name: Detect one-time portable release request
        id: portable-release
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          $changed = @(git diff --name-only HEAD^ HEAD)
          if ($changed -contains ".github/PORTABLE_RELEASE") {
            "publish=true" >> $env:GITHUB_OUTPUT
          } else {
            "publish=false" >> $env:GITHUB_OUTPUT
          }

      - name: Package portable ZIP
        shell: pwsh
        run: |
          $archive = Join-Path $PWD "build\DesktopCommanderBridge-win-x64-portable.zip"
          Compress-Archive -Path "build\PortableBridge\*" -DestinationPath $archive -CompressionLevel Optimal
          if (!(Test-Path $archive)) { throw "Portable ZIP was not created." }

      - name: Upload portable executable
        uses: actions/upload-artifact@v7
        with:
          name: DesktopCommanderBridge-win-x64-portable
          path: |
            build/PortableBridge/
            build/DesktopCommanderBridge-win-x64-portable.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publish portable GitHub release
        if: github.event_name == 'push' && steps.portable-release.outputs.publish == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = node -p "require('./package.json').version"
          $tag = "bridge-portable-v$version-$env:GITHUB_RUN_NUMBER"
          $archive = "build\DesktopCommanderBridge-win-x64-portable.zip"
          $gh = Join-Path $PWD "build\\PortableBridge\\tools\\gh.exe"
          if (!(Test-Path $gh)) { throw "The previously verified bundled GitHub CLI was not found at $gh." }
          & $gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            & $gh release upload $tag $archive --repo $env:GITHUB_REPOSITORY --clobber
          } else {
            & $gh release create $tag $archive --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "Desktop Commander Bridge portable v$version (Windows x64)" --notes "Portable Windows x64 build. Extract the ZIP and run DesktopCommanderBridge.exe. Includes its Node.js runtime, application dependencies, GitHub CLI, and Cloudflare Quick Tunnel client."
          }
          if ($LASTEXITCODE -ne 0) { throw "Could not publish the portable GitHub release asset." }
