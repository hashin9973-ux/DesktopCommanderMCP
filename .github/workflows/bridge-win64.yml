name: Windows x64 bridge executable

on:
  push:
    branches: [main]
    paths:
      - 'src/bridge/**'
      - 'src/index.ts'
      - 'scripts/bridge-launcher.cjs'
      - 'test/test-bridge-*.js'
      - 'docs/GITHUB_REPOSITORY_BRIDGE.md'
      - '.github/workflows/bridge-win64.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-smoke-test:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.23.4
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and run bridge and security regression tests
        run: >-
          npm test --
          test-bridge-protocol.js
          test-bridge-guide.js
          test-bridge-github.js
          test-atomic-write.js
          test-file-handlers.js
          test-read-multiple-files.js
          test-allowed-directories.js
          test-blocked-commands.js
          test-startup-imports.js
          test-image-write-file-append.js
          test-mailbox.js

      - name: Build standalone Windows x64 executable
        run: npm run build:bridge:win64

      - name: Verify executable CLI
        shell: pwsh
        run: |
          & build\PortableBridge\DesktopCommanderBridge.exe bridge --help
          if ($LASTEXITCODE -ne 0) { throw "Bridge executable help command failed." }

      - name: Smoke-test file bridge and image artifact export
        shell: pwsh
        run: |
          $cloudDir = Join-Path $env:TEMP "DesktopCommanderBridgeSmoke"
          $stateDir = Join-Path $env:LOCALAPPDATA "DesktopCommanderBridge"
          New-Item -ItemType Directory -Force -Path $cloudDir, (Join-Path $cloudDir 'requests'), $stateDir | Out-Null

          $settings = @{
            directory = $cloudDir
            pollIntervalMs = 1000
            commandDelayMs = 0
            maxParallelRequests = 0
            maxStorageBytes = 3000000000
            consentAccepted = $true
          } | ConvertTo-Json
          [System.IO.File]::WriteAllText(
            (Join-Path $stateDir "settings.json"),
            $settings,
            [System.Text.UTF8Encoding]::new($false)
          )

          $imagePath = Join-Path $cloudDir "pixel.png"
          $png = "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAwMCAO+/pWQAAAAASUVORK5CYII="
          [System.IO.File]::WriteAllBytes($imagePath, [Convert]::FromBase64String($png))

          $imageRequest = @{
            protocol_version = 1
            id = "smoke-image"
            command_delay_ms = 5000
            commands = @(
              @{ tool = "read_file"; arguments = @{ path = $imagePath } },
              @{ tool = "get_file_info"; arguments = @{ path = $imagePath } }
            )
          } | ConvertTo-Json -Depth 20
          $mailboxSmokeSender = "BridgeSmokeSender-" + [Guid]::NewGuid().ToString("N")
          $mailboxSmokeRecipient = "BridgeSmokeRecipient-" + [Guid]::NewGuid().ToString("N")
          $configRequest = @{
            protocol_version = 1
            id = "smoke-config"
            commands = @(
              @{ tool = "get_config"; arguments = @{} },
              @{ tool = "mailbox"; arguments = @{ action = "register"; username = $mailboxSmokeSender } },
              @{ tool = "mailbox"; arguments = @{ action = "register"; username = $mailboxSmokeRecipient } }
            )
          } | ConvertTo-Json -Depth 20

          [System.IO.File]::WriteAllText(
            (Join-Path $cloudDir "requests\request-smoke-image.json"),
            $imageRequest,
            [System.Text.UTF8Encoding]::new($false)
          )
          [System.IO.File]::WriteAllText(
            (Join-Path $cloudDir "requests\request-smoke-config.json"),
            $configRequest,
            [System.Text.UTF8Encoding]::new($false)
          )

          $exe = (Resolve-Path "build\PortableBridge\DesktopCommanderBridge.exe").Path
          $processArgs = 'bridge --directory "' + $cloudDir + '" --max-parallel 0'
          $stdout = Join-Path $env:TEMP "dc-bridge-smoke-out.txt"
          $stderr = Join-Path $env:TEMP "dc-bridge-smoke-err.txt"
          $process = Start-Process -FilePath $exe -ArgumentList $processArgs -PassThru -NoNewWindow -RedirectStandardOutput $stdout -RedirectStandardError $stderr

          try {
            $imageResponsePath = Join-Path $cloudDir "responses\response-smoke-image.json"
            $configResponsePath = Join-Path $cloudDir "responses\response-smoke-config.json"

            # The first request pauses for five seconds between its two commands.
            # The independent request must complete during that pause.
            $parallelDeadline = (Get-Date).AddSeconds(3)
            while ((Get-Date) -lt $parallelDeadline -and !(Test-Path $configResponsePath)) {
              if ($process.HasExited) {
                throw "Bridge exited before the independent request completed. stdout: $(Get-Content $stdout -Raw -ErrorAction SilentlyContinue) stderr: $(Get-Content $stderr -Raw -ErrorAction SilentlyContinue)"
              }
              Start-Sleep -Milliseconds 100
            }
            if (!(Test-Path $configResponsePath)) {
              throw "A separate request file did not complete while the first request was in its configured 5-second command delay."
            }
            if (Test-Path $imageResponsePath) {
              throw "The two commands in one request did not respect the configured sequential command delay."
            }

            $deadline = (Get-Date).AddSeconds(60)
            while ((Get-Date) -lt $deadline -and !(Test-Path $imageResponsePath)) {
              if ($process.HasExited) {
                throw "Bridge exited before producing the image response. stdout: $(Get-Content $stdout -Raw -ErrorAction SilentlyContinue) stderr: $(Get-Content $stderr -Raw -ErrorAction SilentlyContinue)"
              }
              Start-Sleep -Milliseconds 200
            }
            if (!(Test-Path $imageResponsePath)) {
              throw "Bridge did not finish the sequential image request within 60 seconds."
            }

            $imageResponse = Get-Content $imageResponsePath -Raw | ConvertFrom-Json
            $configResponse = Get-Content $configResponsePath -Raw | ConvertFrom-Json
            if ($imageResponse.status -ne "completed" -or $imageResponse.results.Count -ne 2) {
              throw "Sequential multi-command image request failed: $($imageResponse | ConvertTo-Json -Depth 10)"
            }
            if ($configResponse.status -ne "completed" -or $configResponse.results.Count -ne 3) {
              throw "Independent config/mailbox registration request failed: $($configResponse | ConvertTo-Json -Depth 10)"
            }
            $mailboxSenderResult = $configResponse.results[1]
            $mailboxRecipientResult = $configResponse.results[2]
            if ($mailboxSenderResult.tool -ne "mailbox" -or $mailboxSenderResult.status -ne "succeeded" -or $mailboxSenderResult.isError -or $mailboxRecipientResult.tool -ne "mailbox" -or $mailboxRecipientResult.status -ne "succeeded" -or $mailboxRecipientResult.isError) {
              throw "Mailbox registration did not execute successfully through the portable bridge: $($configResponse | ConvertTo-Json -Depth 10)"
            }
            $mailboxSender = $mailboxSenderResult.content[0].text | ConvertFrom-Json
            $mailboxRecipient = $mailboxRecipientResult.content[0].text | ConvertFrom-Json
            if ($mailboxSender.status -ne "registered" -or $mailboxSender.username -ne $mailboxSmokeSender -or [string]::IsNullOrEmpty($mailboxSender.mailbox_user_id) -or $mailboxRecipient.status -ne "registered" -or $mailboxRecipient.username -ne $mailboxSmokeRecipient -or [string]::IsNullOrEmpty($mailboxRecipient.mailbox_user_id)) {
              throw "Portable bridge mailbox registration returned an invalid identity: $($mailboxSender | ConvertTo-Json -Depth 5) / $($mailboxRecipient | ConvertTo-Json -Depth 5)"
            }

            $mailboxSmokeMessage = "Portable bridge mailbox smoke message " + [Guid]::NewGuid().ToString("N")
            $mailboxSendRequest = @{
              protocol_version = 1
              id = "smoke-mailbox-send"
              commands = @(
                @{ tool = "mailbox"; arguments = @{ action = "send"; mailbox_user_id = $mailboxSender.mailbox_user_id; to = $mailboxSmokeRecipient; message = $mailboxSmokeMessage } }
              )
            } | ConvertTo-Json -Depth 20
            [System.IO.File]::WriteAllText((Join-Path $cloudDir "requests\request-smoke-mailbox-send.json"), $mailboxSendRequest, [System.Text.UTF8Encoding]::new($false))
            $mailboxSendResponsePath = Join-Path $cloudDir "responses\response-smoke-mailbox-send.json"
            $mailboxDeadline = (Get-Date).AddSeconds(30)
            while ((Get-Date) -lt $mailboxDeadline -and !(Test-Path $mailboxSendResponsePath)) {
              if ($process.HasExited) { throw "Bridge exited before producing the mailbox send response. stdout: $(Get-Content $stdout -Raw -ErrorAction SilentlyContinue) stderr: $(Get-Content $stderr -Raw -ErrorAction SilentlyContinue)" }
              Start-Sleep -Milliseconds 200
            }
            if (!(Test-Path $mailboxSendResponsePath)) { throw "Portable bridge did not finish mailbox send within 30 seconds." }
            $mailboxSendResponse = Get-Content $mailboxSendResponsePath -Raw | ConvertFrom-Json
            if ($mailboxSendResponse.status -ne "completed" -or $mailboxSendResponse.results.Count -ne 1 -or $mailboxSendResponse.results[0].tool -ne "mailbox" -or $mailboxSendResponse.results[0].status -ne "succeeded" -or $mailboxSendResponse.results[0].isError) {
              throw "Mailbox send failed through the portable bridge: $($mailboxSendResponse | ConvertTo-Json -Depth 10)"
            }

            $mailboxNoticeRequest = @{
              protocol_version = 1
              id = "smoke-mailbox-notice"
              commands = @(
                @{ tool = "get_config"; arguments = @{ mailbox_user_id = $mailboxRecipient.mailbox_user_id } }
              )
            } | ConvertTo-Json -Depth 20
            [System.IO.File]::WriteAllText((Join-Path $cloudDir "requests\request-smoke-mailbox-notice.json"), $mailboxNoticeRequest, [System.Text.UTF8Encoding]::new($false))
            $mailboxNoticeResponsePath = Join-Path $cloudDir "responses\response-smoke-mailbox-notice.json"
            $mailboxDeadline = (Get-Date).AddSeconds(30)
            while ((Get-Date) -lt $mailboxDeadline -and !(Test-Path $mailboxNoticeResponsePath)) {
              if ($process.HasExited) { throw "Bridge exited before producing the mailbox notice response." }
              Start-Sleep -Milliseconds 200
            }
            if (!(Test-Path $mailboxNoticeResponsePath)) { throw "Portable bridge did not finish the mailbox notice request within 30 seconds." }
            $mailboxNoticeResponse = Get-Content $mailboxNoticeResponsePath -Raw | ConvertFrom-Json
            if ($mailboxNoticeResponse.status -ne "completed" -or $mailboxNoticeResponse.results.Count -ne 1 -or $mailboxNoticeResponse.results[0].content[0].text -notmatch '1 new message') {
              throw "Ordinary bridge tools did not receive the mailbox unread notice: $($mailboxNoticeResponse | ConvertTo-Json -Depth 10)"
            }

            $mailboxInboxRequest = @{
              protocol_version = 1
              id = "smoke-mailbox-inbox"
              commands = @(
                @{ tool = "mailbox"; arguments = @{ action = "inbox_unread"; mailbox_user_id = $mailboxRecipient.mailbox_user_id } }
              )
            } | ConvertTo-Json -Depth 20
            [System.IO.File]::WriteAllText((Join-Path $cloudDir "requests\request-smoke-mailbox-inbox.json"), $mailboxInboxRequest, [System.Text.UTF8Encoding]::new($false))
            $mailboxInboxResponsePath = Join-Path $cloudDir "responses\response-smoke-mailbox-inbox.json"
            $mailboxDeadline = (Get-Date).AddSeconds(30)
            while ((Get-Date) -lt $mailboxDeadline -and !(Test-Path $mailboxInboxResponsePath)) {
              if ($process.HasExited) { throw "Bridge exited before producing the mailbox inbox response." }
              Start-Sleep -Milliseconds 200
            }
            if (!(Test-Path $mailboxInboxResponsePath)) { throw "Portable bridge did not finish the mailbox inbox request within 30 seconds." }
            $mailboxInboxResponse = Get-Content $mailboxInboxResponsePath -Raw | ConvertFrom-Json
            if ($mailboxInboxResponse.status -ne "completed" -or $mailboxInboxResponse.results.Count -ne 1 -or $mailboxInboxResponse.results[0].tool -ne "mailbox" -or $mailboxInboxResponse.results[0].status -ne "succeeded" -or $mailboxInboxResponse.results[0].content[0].text -notmatch [regex]::Escape($mailboxSmokeMessage)) {
              throw "Portable bridge mailbox inbox did not return the sent message: $($mailboxInboxResponse | ConvertTo-Json -Depth 10)"
            }
            if ($imageResponse.artifacts.Count -lt 1) {
              throw "Image read did not produce an artifact reference."
            }

            $relativeArtifact = $imageResponse.artifacts[0].path.Replace('/', '\')
            $artifactPath = Join-Path $cloudDir $relativeArtifact
            if (!(Test-Path $artifactPath)) {
              throw "The image artifact referenced by the response was not materialized: $artifactPath"
            }
            $guidePath = Join-Path $cloudDir "README.md"
            if (!(Test-Path $guidePath)) {
              throw "Bridge did not generate README.md in the configured cloud folder."
            }
            $guideContent = Get-Content $guidePath -Raw
            if (!$guideContent.Contains("## Optional local mailbox (direct MCP and cloud-folder bridge)")) {
              throw "Generated bridge README is missing the shared local-mailbox section."
            }
            if (!$guideContent.Contains("### mailbox")) {
              throw "Generated bridge README is missing the mailbox tool from its tool catalog."
            }
            if (!$guideContent.Contains("message text, usernames, and mailbox IDs included in a bridge request or returned in a response")) {
              throw "Generated bridge README is missing the mailbox queue-transport privacy note."
            }
            if ($guideContent.Contains("bridge request parser intentionally rejects the")) {
              throw "Generated bridge README still describes mailbox as bridge-inaccessible."
            }
          }
          finally {
            if (!$process.HasExited) {
              Stop-Process -Id $process.Id -Force
              $process.WaitForExit()
            }
          }

      - name: Upload portable executable
        uses: actions/upload-artifact@v7
        with:
          name: DesktopCommanderBridge-win-x64-portable
          path: build/PortableBridge/
          if-no-files-found: error
          retention-days: 30
